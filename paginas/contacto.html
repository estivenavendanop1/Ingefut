<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Aroma - Contacto</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header>
    <h1>Café Aroma</h1>
    <nav>
      <a href="../index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="multimedia.html">Multimedia</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Escríbenos</h2>
      <form id="formulario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>

        <label for="bebida">Bebida favorita:</label>
        <select id="bebida">
          <option>Tinto</option>
          <option>Capuchino</option>
          <option>Latte</option>
          <option>Moka</option>
        </select>

        <label>¿Cómo nos conociste?</label>
        <input type="radio" name="medio" id="amigos" checked>
        <label for="amigos" class="en-linea">Amigos</label>
        <input type="radio" name="medio" id="redes">
        <label for="redes" class="en-linea">Redes sociales</label>

        <label for="texto-mensaje">Mensaje:</label>
        <textarea id="texto-mensaje" rows="4" required></textarea>

        <p><input type="checkbox" id="acepto"> Quiero recibir promociones</p>

        <button type="submit">Enviar</button>
      </form>
      <p id="resultado"></p>
    </section>
  </main>

  <footer>
    <p>Proyecto de Desarrollo Web</p>
  </footer>

  <script src="../js/formulario.js"></script>
</body>
</html>
