<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingeniosfut</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header>
    <h1>Formulario Futbolero</h1>
    <nav>
      <a href="../index.html">Inicio</a>
      <a href="../paginas/equipos.html">Clubes</a>
      <a href="../paginas/multimedia.html">Momentos (FPC)</a>
      <a href="../paginas/contacto.html">Formulario</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Aqui puedes elegir tu equipo favorito</h2>
      <form action="#">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" required>

        <label for="equipo">Equipo favorito:</label>
        <select id="equipo">
          <option>Atlético Nacional</option>
          <option>Millonarios</option>
          <option>América de Cali</option>
          <option>Junior</option>
          <option>Otro</option>
        </select>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" rows="4"></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>UNILLANOS</p>
  </footer>
</body>
</html>
